<!--I made minor tweaks to "about.html".
  - to make the history section connect with the HQ location I chose.
  -to add classes which is there tag plus "a" and changed their css to the add a dot at the beginning and an a at the end, to prevent css from applying to two files what ought only be applied to one-->

<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="styles/rafting.css">
	<title>White Water Rafting | Contact Us</title>
	<meta name="description"
	  content="'Contact Us' page, a form, on 'White Water Rafting Company' website | main sections: company 'contact-info', 'map' and 'form' fields, 'employee-profiles'">
	<meta name="author" content="Carson K. Cannon">
</head>

<body>

	<header>
		<img src="images/wwr-logo.webp"
		  alt="White Water Rafting Logo | background layers of blue and white for the sky, green for the trees, and blue for the water, encased in a circle, and over it the word 'Rapids' in big thick wavy white lettering, exuding wetness">
		<nav class="flex-container">
			<div class="flex-item item 1">
				<a href="index.html">Home</a>
			</div>
			<div class="flex-item item2">
				<a href="about.html">About Us</a>
			</div>
			<div class="flex-item item3">
				<a href="trips.html">Trips</a>
			</div>
			<div class="flex-item item4">
				<a href="contact.html">
					Contact Us</a>
			</div>
		</nav>
	</header>

	<main><!--class="mainc"-->
		<!-- |CONTACT INFO| -->
		<section id="contact-info">
			<div class="contact-info-subsection" id="co-card">
				<h1 class="company-name" id="co1">White Water Rafting Company</h1>
				<div class="code-card-core" id="cccc">
					<div class="company-street" id="co2">743 Shoshone St S</div>
					<div class="company-city" id="co3">Twin Falls, Idaho (USA)</div>
					<div class="company-phone" id="co4">+1 (200) 432-4489</div>
					<div class="company-email" id="co5">info@whitewater.com</div>
				</div>
			</div>
		</section>
		<br>
		<div id="grid-container-de-duo" class="contains-'map'-section-and-'form'-section">
			<section id="co-map" class="left-of-form">
				<!--iframe not count for page weight (in kb)-->
				<iframe
				  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d6539.736604887631!2d-114.47732511103759!3d42.55134815968841!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x54aca30b985e8f03%3A0x5aeb49d3f2afd4f6!2s743%20Shoshone%20St%20S%2C%20Twin%20Falls%2C%20ID%2083301!5e0!3m2!1sen!2sus!4v1791263081517!5m2!1sen!2sus"
				  width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
				  referrerpolicy="strict-origin-when-cross-origin">
				</iframe>
			</section>

			<section class="form" id="conformc">
				<form class="informc norm">
					<!-- FULL NAME -->
					<div class="form-name">
						<label>Name: <input type="text" name="name" id="name"
							  placeholder="first-name last-name" required>
						</label>
					</div><br>
					<!-- EMAIL ADDRESS -->
					<div class="form-email">
						<label>Email: <input type="email" name="email" id="email"
							  placeholder="lowercase@lowercase" required>
						</label>
					</div><br>
					<!-- MULTIPLE CHOICE -->
					<div class="radios">
						<label class="radios-heading" id="hrad">Reason for
							message:<br></label>
						<label><input type="radio" name="radio" id="rad1">General
							Inquiry</label><br>
						<label><input type="radio" name="radio" id="rad2">Reservation
							Question</label><br>
						<label><input type="radio" name="radio" id="rad3">Website
							Suggestion</label><br>
					</div><br>
					<div class="checkbox">
						<label>Please subscribe me to the<br>
							monthly newsletter:
							<input type="checkbox" name="check" id="check"></label>
					</div><br>
					<!-- TEXT-AREA -->
					<div class="textarea">
						<label>Message:<br><textarea name="textarea" id="textarea"
							  placeholder="Paragraph is paragraph!" required></textarea></label>
					</div><br>
					<!-- SUBMIT BUTTON -->
					<button type="submit">Send Form</button>
				</form>
			</section><br>

		</div>

		<section id="employee-profiles" class="norm">
			<h2 id="h2c-employee-profiles">We Are Here to Serve You</h2><br>
			<div class="employee-profiles-sub-section">
				<figure>
					<img src="images/worker1.jpg"
					  alt=" description: joyful white elderly male in a blue life-jacket against a green blurry background | photographer: name='Israel Torres' place='Mexico City' username='israwmx' | sourced from: 'Pexels'">
					<figcaption>Expos Musex</figcaption>
				</figure>
				<figure>
					<img src="images/worker2.jpg"
					  alt="(young polynesian?)  women with white flowers in her dark curly hair, against a flat light blue #ADD8E6 background | sourced from: Pravatar">
					<figcaption>Molli Tiadi</figcaption>
				</figure>
				<figure>
					<img src="images/worker3.jpg"
					  alt=" black and white image of handsome young-ish man in business-casual clothes (face resembles Tony Stark and to a lesser extent Jesus) against flat medium gray #808080 background | sourced from: Pravatar">
					<figcaption>Voluptat Esmoles</figcaption>
				</figure>
			</div>

		</section>


	</main><br>


	<footer>
		<p class="source">©, 2026, White Water Rafting, Carson K. Cannon</p>
		<nav class="socialmedia">
			<a href="https://www.facebook.com">
				<img class="facebook" src="images/facebook.webp" alt="Facebook Icon">
			</a>
			<a href="https://www.linkedin.com">
				<img class="linkedin" src="images/linkedin-tm.jpg" alt="Linkedin Icon">
			</a>
			<a href="https://www.instagram.com">
				<img class="instagram" src="images/instagra-.webp" alt="Instagram Icon">
			</a>
		</nav>
	</footer>
</body>

</html>
