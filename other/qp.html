<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">

	<link rel="stylesheet" href="qp.css">

<body>
	<header></header>
	<main>
		<form action="x.html" method="post">
			<div class="quiz-item">
				<label for="q1">What is 1*1^1?</label>
				<input type="text" id="q1" name="q1">
			</div>
			<div class="quiz-item">
				<label for="q2">What is 2*1^1?</label>
				<textarea name="q2" id="q2"></textarea>
			</div>
			<div class="quiz-item">
				<label for="q3">What is 3*1^1?</label>
				<select type="text" id="q3" name="q3">
					<option value="" selected disabled></option>
					<option value="1">&lt;3</option>
					<option value="2">3</option>
					<option value="3">&gt;3</option>
				</select>
			</div>
			<div class="quiz-item">
				<label for="q4">What does this mean?</label>
				<code>margin: 10px 5px 15px;</code>
				<input type="text" id="q4" name="q4">
			</div>
			<div class="quiz-item">
				<label for="q5">What is 5*1^1?</label>
				<input type="text" id="q5" name="q5">
			</div>
			<button type="submit">Submit Quiz</button>
		</form>

	</main>
	<footer></footer>
</body>
