<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Il Doc</title>

	<link rel="stylesheet" href="gbd.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
	  href="https://fonts.googleapis.com/css2?family=Edu+TAS+Beginner:wght@400..700&family=Roboto:ital,wght@0,100..900;1,100..900&family=Special+Elite&display=swap"
	  rel="stylesheet">


</head>


<body>
	<form>
		<h1>to: Mozilla</h1>

		<div id="from" class="from">
			<label for="name">from:</label>
			<input type="text" id="name" name="user_name" />
		</div>

		<div id="reply" class="reply">
			<label for="mail">reply:</label>
			<input type="email" id="mail" name="user_email" />
		</div>

		<div id="message">
			<label for="msg">Your message:</label>
			<textarea id="msg" name="user_message"></textarea>
		</div>

		<div class="button">
			<button type="submit">Send your message</button>
		</div>
	</form>
</body>

</html>
