<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Poll Form</title>
	<link rel="stylesheet" href="styles/poll-form.css">
</head>

<body>
	<div class="center">
		<header>Form | Page 1 of 1</header>
		<main>
			<h1>WDD 130 | HTML Form - User Poll
			</h1>
			<form>
				<fieldset class="contact-information">
					<legend>Contact Information</legend>
					<label class="fullname">Full Name:<input type="text" name="fullname"
						  id="fullname">
					</label>
					<label class="email">Email:<input type="email" name="useremail" class="email"
						  id="email" required>
					</label>
				</fieldset>
				<fieldset class="questions">
					<legend>Questions</legend>
					<label class="dropdown">Favorite browser:
						<select name="question" id="dropdown">
							<option value="1">Chrome</option>
							<option value="2">Safari</option>
							<option value="3">Edge</option>
							<option value="4">Explorer!?</option>
							<option value="5">other</option>
						</select>
						<label class="feedback">
							Places you lived in:
							<textarea name="life" id="feedback" rows="3" placeholder="City State, 
							  City State, 
							  City State"></textarea>
						</label>
					</label>
					<label class="checkbox">Do you have a pet?:
						<input type="checkbox" name="" id="checkbox">
					</label>
				</fieldset>
				<div class="submit">____________________________________</div>
				<button type="submit" id="submit">Submit Poll</button>
			</form>
		</main>
		<footer>&copy2026 | HTML Form - User Poll Activity | Carson K. Cannon </footer>
	</div>
</body>

</html>
