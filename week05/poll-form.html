<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Poll Form</title>
	<link rel="stylesheet" href="styles/poll-form.css">
</head>

<body>
	<div class="center">
		<header>Form | Page 1 of 1</header>
		<main>
			<h1>WDD 130 | HTML Form - User Poll
			</h1>
			<form>
				<fieldset class="contact-information">
					<legend>Contact Information</legend>
					<label class="fullname outblue">Full Name:<input class="fullname reply inblue"
						  type="text" name="fullname" id="fullname">
					</label>
					<label class="email outblack">Email:<input type="email" name="useremail"
						  class="email reply inblack" id="email" required>
					</label>
				</fieldset>
				<fieldset class="questions">
					<legend>Questions</legend>
					<label class="dropdown outblue">Favorite browser:
						<select name="question" id="dropdown" class="dropdown reply inblue">
							<option value="1">Chrome</option>
							<option value="2">Safari</option>
							<option value="3">Edge</option>
							<option value="4">Explorer!?</option>
							<option value="5">other</option>
						</select>
						<label class="feedback outblack">
							Places you lived in:
							<textarea class="feedback reply inblack" name="life" id="feedback"
							  rows="3" placeholder="City State, 
							  City State, 
							  City State"></textarea>
						</label>
					</label>
					<label class="checkbox outblue">Do you have a pet?:
						<input class="reply inblue" type="checkbox" name="" id="checkbox">
					</label>
				</fieldset>
				<div class="submit">____________________________________</div>
				<button class="reply inblack" type="submit" id="submit">Submit Poll</button>
			</form>
		</main>
		<footer>&copy2026 | HTML Form - User Poll Activity | Carson K. Cannon </footer>
	</div>
</body>

</html>
